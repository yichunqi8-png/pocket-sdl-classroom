[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-sdl-lab"
version = "1.0.0"
description = "Uni-Lab OS device package for Pocket SDL (Pico H + AS7341 + WS2812B spectral closed-loop module)"
readme = "DEVICE_PACKAGE_REQUIREMENTS.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pocket-sdl>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["pocket_sdl_lab*"]

[tool.setuptools.package-data]
pocket_sdl_lab = ["*.json", "*.yaml"]
