[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-sdl-lab"
version = "1.1.0"
description = "Uni-Lab OS 设备包工作区：Pico H + AS7341 + WS2812B 光谱闭环模块"
readme = "DEVICE_PACKAGE_REQUIREMENTS.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["unilabos"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["pocket_sdl_lab*"]

[tool.setuptools.package-data]
pocket_sdl_lab = ["*.json", "*.yaml", "workflow_publications/**/*.json"]

[tool.unilabos.startup]
graph = "deployment/graphs/dry-run.json"
config = "deployment/local_config.py"
ensure_dependencies = false
