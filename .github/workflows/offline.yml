name: Offline classroom bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15-intel
            label: Mac-Intel
          - os: macos-15
            label: Mac-Apple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pyserial==3.5 pyinstaller==6.16.0
      - run: python packaging/build_offline.py --label ${{ matrix.label }}
      - run: python packaging/smoke_offline.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-SDL-Offline-${{ matrix.label }}
          path: artifacts/*
