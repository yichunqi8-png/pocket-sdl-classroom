<text x="85" y="981" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="400">插好配套线后，再按板上的 ＋、−、DI 标识核对线序；母孔与公针插紧，不剪线、不硬塞。</text>
