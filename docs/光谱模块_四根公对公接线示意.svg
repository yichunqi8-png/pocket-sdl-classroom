<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1120" viewBox="0 0 1640 1120"><rect width="1640" height="1120" fill="white"/>
<text x="55" y="75" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="37" fill="#263B42" font-weight="700">光谱模块怎么接？4 根公对公线，另外 2 根留空</text>
<text x="55" y="124" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="24" fill="#526A72" font-weight="400">配套白色六芯插头 → 六根分开的黑色母头 → 只接 VCC、GND、SDA、SCL</text>
<rect x="55" y="165" width="450" height="65" rx="7" fill="#EAF5F0" stroke="none" stroke-width="2"/>
<text x="73" y="207" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="25" fill="#168C79" font-weight="700">① 白色插头接模块</text>
<rect x="535" y="165" width="500" height="65" rx="7" fill="#EAF5F0" stroke="none" stroke-width="2"/>
<text x="553" y="207" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="25" fill="#168C79" font-weight="700">② 四个母头各插一个公头</text>
<rect x="1065" y="165" width="520" height="65" rx="7" fill="#EAF5F0" stroke="none" stroke-width="2"/>
<text x="1083" y="207" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="25" fill="#168C79" font-weight="700">③ 另一公头插面包板</text>
<rect x="65" y="300" width="260" height="490" rx="16" fill="#2C6386" stroke="none" stroke-width="2"/>
<text x="95" y="351" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="29" fill="white" font-weight="700">光谱传感器</text>
<text x="95" y="391" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="21" fill="white" font-weight="400">本次使用 I²C 通信</text>
