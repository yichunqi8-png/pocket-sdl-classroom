<rect x="1080" y="612" width="57" height="6" rx="1" fill="#C7A85F" stroke="none" stroke-width="2"/>
<rect x="1134" y="610" width="9" height="10" rx="1" fill="#526A72" stroke="none" stroke-width="2"/>
<text x="1165" y="622" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#AA791B" font-weight="700">与 GP27 相通的孔</text>
<polyline points="417,670 660,670" fill="none" stroke="#7F8C87" stroke-width="7" stroke-linecap="round"/>
<text x="465" y="657" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#263B42" font-weight="700">INT</text>
<rect x="660" y="656" width="80" height="28" rx="3" fill="#263B42" stroke="none" stroke-width="2"/>
<rect x="724" y="662" width="16" height="16" rx="1" fill="#0F1C20" stroke="none" stroke-width="2"/>
<text x="775" y="678" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="700">留空，不接杜邦线</text>
<polyline points="417,725 660,725" fill="none" stroke="#7F8C87" stroke-width="7" stroke-linecap="round"/>
<text x="465" y="712" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#263B42" font-weight="700">GPIO</text>
<rect x="660" y="711" width="80" height="28" rx="3" fill="#263B42" stroke="none" stroke-width="2"/>
<rect x="724" y="717" width="16" height="16" rx="1" fill="#0F1C20" stroke="none" stroke-width="2"/>
<text x="775" y="733" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="700">留空，不接杜邦线</text>
<text x="240" y="840" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="400">白色插座</text>
<polyline points="307,815 323,780" fill="none" stroke="#9BA9A4" stroke-width="2" stroke-linecap="round"/>
<text x="368" y="886" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="400">白色六芯插头</text>
<polyline points="443,857 389,777" fill="none" stroke="#9BA9A4" stroke-width="2" stroke-linecap="round"/>
<text x="590" y="840" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="23" fill="#263B42" font-weight="700">分开的黑色母头</text>
<polyline points="687,813 700,754" fill="none" stroke="#9BA9A4" stroke-width="2" stroke-linecap="round"/>
<text x="795" y="394" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#168C79" font-weight="700">公头插进母孔</text>
<text x="845" y="818" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="24" fill="#168C79" font-weight="700">四根公对公杜邦线</text>
<text x="1105" y="846" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#168C79" font-weight="700">公头插面包板</text>
<text x="1152" y="744" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="18" fill="#526A72" font-weight="400">端点位置示意，非实际相邻孔位</text>
<rect x="55" y="930" width="1530" height="145" rx="7" fill="#FFF5E9" stroke="none" stroke-width="2"/>
<text x="80" y="973" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="24" fill="#263B42" font-weight="700">先断开 USB；白色插头按卡扣方向插入，不硬塞。INT、GPIO 两根母头单独留空。</text>
<text x="80" y="1015" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="22" fill="#526A72" font-weight="400">先按板上丝印找出 VCC / GND / SDA / SCL，再沿对应线找到黑色母头；不要仅凭线色判断。</text>
<text x="80" y="1054" font-family="Hiragino Sans GB, PingFang SC, Arial" font-size="20" fill="#526A72" font-weight="400">图中灰色表示配套线，彩色表示外接线的功能，不表示你手中线材的固定颜色。模块需确认支持 3.3V。</text>
</svg>